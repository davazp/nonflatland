<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nonflatland</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <label>
        Space
        <select id="space">
          <optgroup label="Flat">
            <option value="0">Plane</option>
            <option value="1">Torus</option>
            <option value="2">Klein bottle</option>
            <option value="3">Pillowcase (cone points)</option>
          </optgroup>
          <optgroup label="Curved">
            <option value="4">Sphere (K = +1)</option>
            <option value="5">Projective plane (K = +1)</option>
            <option value="8">Genus-2 surface (K = −1)</option>
            <option value="6">Donut torus (variable K)</option>
            <option value="7">Hilly torus (variable K)</option>
          </optgroup>
        </select>
      </label>
      <label>
        Camera
        <select id="camera">
          <option value="0">Fixed</option>
          <option value="1">Ship</option>
        </select>
      </label>
      <div class="help">
        ←/→ or A/D rotate · ↑/W thrust · ↓/S reverse · Space shoot<br />
        C toggle camera · K curvature tint · R reset · +/− or wheel zoom
      </div>
    </div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
